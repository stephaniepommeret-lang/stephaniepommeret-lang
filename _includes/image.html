{%- assign asset = site.data.images[include.path] -%}
<img src="{{ include.path | relative_url }}" alt="{{ include.alt | escape }}"
    {%- if asset %} width="{{ asset.width }}" height="{{ asset.height }}"{% endif %}
    {%- if asset.srcset %}
    {%- assign image_width = asset.width | at_most: 800 -%}
    {%- assign breakpoint = image_width | divided_by: 0.9 | ceil %}
    {%- capture image_sizes %}(max-width: {{ breakpoint }}px) 90vw, {{ image_width }}px{% endcapture %}
    srcset="{%- assign candidates = asset.srcset | split: ', ' -%}
        {%- for candidate in candidates -%}
            {%- assign parts = candidate | split: ' ' -%}
            {{ parts[0] | relative_url }} {{ parts[1] }}{% unless forloop.last %}, {% endunless %}
        {%- endfor -%}"
    sizes="{{ include.sizes | default: image_sizes }}"
    {%- endif %}
    {%- if include.style %} style="{{ include.style }}"{% endif %}
    {% if include.priority %}fetchpriority="high"{% else %}loading="lazy" decoding="async"{% endif %}>
