social:
  name: "Stéphanie Pommeret"
  facebook: stephaniepommeret
  instagram: stephaniepommeret
  links:
    - "https://www.facebook.com/stephaniepommeret"
    - "https://www.instagram.com/stephaniepommeret/"
    - "https://www.adagp.fr/fr/identities/stephanie-pommeret-1152583"
    - "https://bienalsur.org/es/artistas/597"
