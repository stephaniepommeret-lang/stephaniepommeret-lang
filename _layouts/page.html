---
layout: default
---

{% if page.hero_image %}
<section class="hero">
    <picture>
        {% if page.hero_image_webp %}
        <source srcset="{{ page.hero_image_webp }}" type="image/webp">
        {% endif %}
        <img src="{{ page.hero_image }}" alt="{{ page.hero_alt | default: page.title }}" width="1200" height="794" fetchpriority="high">
    </picture>
</section>
{% endif %}

<section class="intro">
    {{ content }}
</section>
