---
layout: default
---

<article>
    <header class="intro">
        <h1 class="project-title">{{ page.title }}</h1>
        {% if page.subtitle %}
        <p>{{ page.subtitle }}</p>
        {% endif %}
    </header>

    <section class="page-content">
        {% if page.main_image %}
        <figure class="project-image-full">
            {% assign main_alt = page.main_image_alt | default: page.image.alt | default: page.title %}
            {% include image.html path=page.main_image alt=main_alt priority=true %}
            {% if page.main_image_caption %}
            <figcaption class="caption">{{ page.main_image_caption }}</figcaption>
            {% endif %}
        </figure>
        {% endif %}

        <div class="project-content">
            {{ content }}
        </div>
    </section>
</article>
